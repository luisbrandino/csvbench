<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>csvbench</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <input id="filter-input" type="text" autocomplete="off" spellcheck="false">
  <div id="table-header">
    <div class="cell col-id">id</div>
    <div class="cell col-name">name</div>
    <div class="cell col-category">category</div>
    <div class="cell col-value">value</div>
    <div class="cell col-date">date</div>
  </div>
  <div id="table-scroll">
    <div id="table-spacer"></div>
  </div>
  <div id="footer"></div>
</div>
<script src="renderer.js"></script>
</body>
</html>
